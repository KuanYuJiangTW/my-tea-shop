services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: my-tea-shop-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    restart: unless-stopped
